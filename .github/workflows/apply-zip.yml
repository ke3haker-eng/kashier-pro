name: Apply uploaded zip
on:
  workflow_dispatch:
    inputs:
      zip:
        description: "zip file name in repo root"
        default: "kashier-pro-v2.2.0b.zip"
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository contents with the zip
        env:
          ZIP: ${{ inputs.zip }}
        run: |
          set -euo pipefail
          [ -f "$ZIP" ] || { echo "zip not found in repo root"; exit 1; }
          NEW="$RUNNER_TEMP/new"; rm -rf "$NEW"; mkdir -p "$NEW"
          unzip -q "$ZIP" -d "$NEW"
          SRC="$NEW/kashier-pro"
          if [ ! -f "$SRC/index.html" ] || [ ! -f "$SRC/store.html" ]; then echo "bad zip"; exit 1; fi
          rm -rf "$SRC/.github"
          KEEP=""
          if [ -f src/config.js ] && grep -Eq "url:[[:space:]]*['\"]https?://" src/config.js; then cp src/config.js "$RUNNER_TEMP/config.keep"; KEEP=1; fi
          git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in .github/*) continue;; esac
            git rm -q -f -- "$f"
          done
          cp -a "$SRC"/. .
          if [ -n "$KEEP" ]; then cp "$RUNNER_TEMP/config.keep" src/config.js; fi
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Update to kashier-pro 2.2.0"
          git push
      - name: Start the Pages deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml
